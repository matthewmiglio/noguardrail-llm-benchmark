[tool.poetry]
package-mode = false

[project]
name = "noguardrail-llm-benchmark"
version = "0.1.0"
description = "Benchmark suite for testing guardrail behavior of unguardrailed dolphin LLM models"
authors = [
    {name = "Matt Main_PC",email = "matmigg0804@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python>=0.2",
    "huggingface-hub>=0.23",
    "hf-transfer>=0.1",
    "transformers>=4.40",
    "torch>=2.2",
    "accelerate>=0.30",
    "pandas>=2.0",
    "tqdm>=4.60",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
